name: Update Nepal News

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install packages
        run: |
          pip install feedparser

      - name: Create news updater
        run: |
          cat > update_news.py <<'PY'
          import feedparser
          import json
          from datetime import datetime, timezone

          SOURCES = [
              {
                  "name": "The Kathmandu Post",
                  "url": "https://kathmandupost.com/rss"
              },
              {
                  "name": "myRepublica",
                  "url": "https://myrepublica.nagariknetwork.com/feeds"
              }
          ]

          sections = {
              "national": [],
              "politics": [],
              "business": [],
              "sports": [],
              "technology": [],
              "entertainment": [],
              "world": [],
              "crime": [],
              "health": [],
              "weather": []
          }

          keywords = {
              "politics": ["government", "minister", "parliament", "election", "party", "political", "prime minister"],
              "business": ["business", "economy", "bank", "market", "company", "trade", "finance", "investment"],
              "sports": ["football", "cricket", "sport", "tournament", "player", "match", "league"],
              "technology": ["technology", "tech", "digital", "ai", "artificial intelligence", "software", "internet"],
              "entertainment": ["movie", "film", "music", "actor", "actress", "entertainment", "concert"],
              "world": ["world", "international", "india", "china", "america", "iran", "israel", "usa"],
              "crime": ["crime", "police", "arrest", "murder", "fraud", "accident", "security"],
              "health": ["health", "hospital", "doctor", "disease", "medical", "medicine"],
              "weather": ["weather", "rain", "flood", "storm", "snow", "temperature"]
          }

          def classify(title, summary):
              text = (title + " " + summary).lower()

              for section, words in keywords.items():
                  if any(word in text for word in words):
                      return section

              return "national"

          for source in SOURCES:
              try:
                  feed = feedparser.parse(source["url"])

                  for item in feed.entries[:30]:
                      title = item.get("title", "").strip()
                      summary = item.get("summary", "").strip()
                      link = item.get("link", "").strip()

                      if not title or not link:
                          continue

                      section = classify(title, summary)

                      sections[section].append({
                          "title": title,
                          "summary": summary,
                          "source": source["name"],
                          "link": link,
                          "published": item.get("published", "")
                      })

              except Exception as error:
                  print("Source error:", source["name"], error)

          # Keep only the first 10 stories in every section.
          for section in sections:
              sections[section] = sections[section][:10]

          output = {
              "updated": datetime.now(timezone.utc).isoformat(),
              "sections": sections
          }

          with open("news.json", "w", encoding="utf-8") as file:
              json.dump(output, file, ensure_ascii=False, indent=2)

          print("News updated successfully.")

          PY

      - name: Update news
        run: python update_news.py

      - name: Save news
        run: |
          git config user.name "Nepal News Bot"
          git config user.email "actions@github.com"
          git add news.json
          git diff --cached --quiet || git commit -m "Update news"
          git push
