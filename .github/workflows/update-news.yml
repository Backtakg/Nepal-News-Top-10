name: Update Nepal News

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # Checkout repository
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Setup Python
      # --------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --------------------------------------------------
      # Install dependencies
      # --------------------------------------------------
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser beautifulsoup4

      # --------------------------------------------------
      # Run news scraper
      # --------------------------------------------------
      - name: Run scraper
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |
          python scraper.py

      # --------------------------------------------------
      # Validate generated news.json
      # --------------------------------------------------
      - name: Validate news database
        run: |
          test -f news.json

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("news.json")

          with path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          if not isinstance(data, dict):
              raise SystemExit("news.json is not a JSON object")

          if "sections" not in data:
              raise SystemExit("news.json is missing 'sections'")

          sections = data["sections"]

          expected = [
              "national",
              "politics",
              "business",
              "sports",
              "technology",
              "entertainment",
              "world",
              "crime",
              "health",
              "weather"
          ]

          for section in expected:
              if section not in sections:
                  raise SystemExit(
                      f"Missing section: {section}"
                  )

          total = sum(
              len(items)
              for items in sections.values()
              if isinstance(items, list)
          )

          print(f"Total stories: {total}")

          if total == 0:
              raise SystemExit(
                  "ERROR: scraper produced zero news stories"
              )

          print("news.json validation successful")
          PY

      # --------------------------------------------------
      # Show generated database
      # --------------------------------------------------
      - name: Show news summary
        run: |
          echo "======================================"
          echo "Generated news database"
          echo "======================================"

          python - <<'PY'
          import json

          with open("news.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          print("Updated:", data.get("updated", ""))

          for section, stories in data["sections"].items():
              print(f"{section}: {len(stories)} stories")
          PY

      # --------------------------------------------------
      # Commit updated news.json
      # --------------------------------------------------
      - name: Commit updated news
        run: |
          git config user.name "Nepal News Bot"
          git config user.email "actions@github.com"

          git add news.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Nepal news"
            git push
          fi
