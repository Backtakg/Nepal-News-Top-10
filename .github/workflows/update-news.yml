name: Update Nepal News

on:
  schedule:
    # Every 3 hours
    - cron: "0 */3 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-nepal-news
  cancel-in-progress: true

jobs:
  update-news:

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:

      # --------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # --------------------------------------------------
      # PYTHON
      # --------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"


      # --------------------------------------------------
      # INSTALL
      # --------------------------------------------------

      - name: Install scraper dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            feedparser \
            requests \
            beautifulsoup4


      # --------------------------------------------------
      # RUN SCRAPER
      # --------------------------------------------------

      - name: Scrape and build news database
        run: |
          python scraper.py


      # --------------------------------------------------
      # VALIDATE JSON
      # --------------------------------------------------

      - name: Validate news.json
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("news.json")

          if not path.exists():
              raise SystemExit("ERROR: news.json was not created")

          with path.open(
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          required = [
              "updated",
              "top10",
              "sections",
              "sources"
          ]

          for key in required:
              if key not in data:
                  raise SystemExit(
                      f"ERROR: missing key: {key}"
                  )

          sections = [
              "national",
              "politics",
              "business",
              "sports",
              "technology",
              "entertainment",
              "world",
              "crime",
              "health",
              "weather"
          ]

          for section in sections:

              if section not in data["sections"]:
                  raise SystemExit(
                      f"ERROR: missing section: {section}"
                  )

              count = len(
                  data["sections"][section]
              )

              print(
                  f"{section}: {count} articles"
              )

          print("")
          print("news.json validation PASSED")
          print(
              "Overall Top 10:",
              len(data["top10"])
          )

          print(
              "Working sources:",
              len(
                  data["sources"]["working"]
              )
          )

          print(
              "Failed sources:",
              len(
                  data["sources"]["failed"]
              )
          )
          PY


      # --------------------------------------------------
      # SHOW NEWS PREVIEW IN ACTION LOG
      # --------------------------------------------------

      - name: Show generated news
        run: |
          echo "======================================"
          echo "GENERATED NEWS PREVIEW"
          echo "======================================"

          python - <<'PY'
          import json

          with open(
              "news.json",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          print("")
          print("UPDATED:")
          print(data["updated"])

          print("")
          print("TOP 10:")
          print("")

          for i, item in enumerate(
              data["top10"],
              1
          ):
              print(
                  f"{i}. {item['title']}"
              )
              print(
                  f"   {item['source']}"
              )

          print("")
          print("CATEGORIES:")
          print("")

          for section, items in data[
              "sections"
          ].items():

              print(
                  f"{section}: {len(items)}"
              )
          PY


      # --------------------------------------------------
      # COMMIT
      # --------------------------------------------------

      - name: Commit updated news
        run: |

          git config user.name "Nepal News Bot"

          git config user.email \
            "actions@github.com"

          git add news.json

          if git diff --cached --quiet; then
            echo "No news changes detected."
            exit 0
          fi

          git commit \
            -m "Update Nepal news database"

          git push
