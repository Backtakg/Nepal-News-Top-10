name: Update Nepal News

on:
  schedule:
    # Every 3 hours
    - cron: "0 */3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-news:

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # Checkout repository
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # --------------------------------------------------
      # Setup Python
      # --------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"


      # --------------------------------------------------
      # Install scraper dependencies
      # --------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            requests \
            beautifulsoup4 \
            feedparser \
            lxml


      # --------------------------------------------------
      # Check scraper exists
      # --------------------------------------------------

      - name: Check scraper
        run: |
          test -f scraper.py
          echo "scraper.py found."


      # --------------------------------------------------
      # Run scraper
      # --------------------------------------------------

      - name: Run scraper
  env:
    NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
  run: |
    python scraper.py


      # --------------------------------------------------
      # Validate generated news.json
      # --------------------------------------------------

      - name: Validate news database
        run: |
          test -f news.json

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("news.json")

          with path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          if not isinstance(data, dict):
              raise SystemExit("news.json is not a JSON object")

          sections = data.get("sections", {})

          required = [
              "weather",
              "national",
              "politics",
              "business",
              "sports",
              "technology",
              "entertainment",
              "world",
              "health",
              "crime"
          ]

          missing = [
              section
              for section in required
              if section not in sections
          ]

          if missing:
              raise SystemExit(
                  "Missing sections: " + ", ".join(missing)
              )

          total = sum(
              len(sections.get(section, []))
              for section in required
          )

          print("Total stories:", total)

          for section in required:
              print(
                  f"{section}: "
                  f"{len(sections.get(section, []))}"
              )

          if total == 0:
              raise SystemExit(
                  "ERROR: Scraper produced zero stories."
              )

          print("news.json validation successful.")
          PY


      # --------------------------------------------------
      # Show scraper output
      # --------------------------------------------------

      - name: Show news database
        run: |
          echo "----------------------------------------"
          echo "Generated news.json"
          echo "----------------------------------------"

          python -m json.tool news.json | head -n 120

          echo ""
          echo "File size:"
          wc -c news.json


      # --------------------------------------------------
      # Commit changes
      # --------------------------------------------------

      - name: Commit news update
        run: |

          git config user.name "Nepal News Bot"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add news.json

          if git diff --cached --quiet; then

            echo "No news changes detected."

          else

            git commit \
              -m "Auto update Nepal news"

            git push

          fi
