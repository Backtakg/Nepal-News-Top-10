name: Update Nepal News

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-news:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # Checkout repository
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # --------------------------------------------------
      # Setup Python
      # --------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # --------------------------------------------------
      # Install scraper dependencies
      # --------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 feedparser

      # --------------------------------------------------
      # Run scraper
      # --------------------------------------------------

      - name: Run news scraper
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |
          python scraper.py

      # --------------------------------------------------
      # Validate news.json
      # --------------------------------------------------

      - name: Validate news database
        run: |
          test -f news.json

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("news.json")

          with path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          if not isinstance(data, dict):
              raise SystemExit("news.json is not a JSON object")

          if "sections" not in data:
              raise SystemExit("news.json is missing 'sections'")

          sections = data["sections"]

          if not isinstance(sections, dict):
              raise SystemExit("'sections' must be an object")

          expected_sections = [
              "national",
              "politics",
              "business",
              "sports",
              "technology",
              "entertainment",
              "world",
              "crime",
              "health",
              "weather"
          ]

          total = 0

          for section in expected_sections:

              articles = sections.get(section, [])

              if not isinstance(articles, list):
                  raise SystemExit(
                      f"Section '{section}' is not a list"
                  )

              count = len(articles)

              print(f"{section}: {count} articles")

              total += count

          print("")
          print(f"TOTAL ARTICLES: {total}")

          if total == 0:
              raise SystemExit(
                  "ERROR: scraper produced zero articles"
              )

          print("")
          print("news.json validation passed.")
          PY

      # --------------------------------------------------
      # Show database summary
      # --------------------------------------------------

      - name: Show news summary
        run: |
          python - <<'PY'
          import json

          with open("news.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          print("Updated:")
          print(data.get("updated", ""))

          print("")
          print("Sections:")

          for section, articles in data.get("sections", {}).items():
              print(f"  {section}: {len(articles)}")
          PY

      # --------------------------------------------------
      # Commit updated news.json
      # --------------------------------------------------

      - name: Commit updated news
        run: |
          git config user.name "Nepal News Bot"
          git config user.email "actions@github.com"

          git add news.json

          if git diff --cached --quiet; then
            echo "No changes to news.json."
          else
            git commit -m "Update Nepal news"
            git push
          fi
