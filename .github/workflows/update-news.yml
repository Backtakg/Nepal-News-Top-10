name: Update Nepal News

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 feedparser

      - name: Run news scraper
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |
          python scraper.py

      - name: Validate generated news.json
        run: |
          test -f news.json

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("news.json")

          with path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          if not isinstance(data, dict):
              raise SystemExit("news.json is not a JSON object")

          if "sections" not in data:
              raise SystemExit("news.json is missing 'sections'")

          sections = data["sections"]

          if not isinstance(sections, dict):
              raise SystemExit("'sections' must be an object")

          expected = [
              "national",
              "politics",
              "business",
              "sports",
              "technology",
              "entertainment",
              "world",
              "crime",
              "health",
              "weather"
          ]

          total = 0

          for section in expected:
              articles = sections.get(section, [])

              if not isinstance(articles, list):
                  raise SystemExit(
                      f"Section '{section}' is not a list"
                  )

              print(
                  f"{section}: {len(articles)} articles"
              )

              total += len(articles)

          print(f"Total articles: {total}")

          if total == 0:
              raise SystemExit(
                  "ERROR: scraper produced zero news articles"
              )

          print("news.json validation passed.")
          PY

      - name: Show news database
        run: |
          echo "----------------------------------------"
          echo "Generated news.json"
          echo "----------------------------------------"

          python - <<'PY'
          import json

          with open("news.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          print("Updated:", data.get("updated", ""))

          sections = data.get("sections", {})

          for section, articles in sections.items():
              print(f"{section}: {len(articles)}")
          PY

      - name: Commit updated news
        run: |
          git config user.name "Nepal News Bot"
          git config user.email "actions@github.com"

          git add news.json

          if git diff --cached --quiet; then
            echo "No news changes to commit."
          else
            git commit -m "Update Nepal news"
            git push
          fi
