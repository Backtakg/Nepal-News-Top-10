name: Update Nepal News

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install packages
        run: |
          pip install feedparser requests

      - name: Download and build news
        run: |
          cat > update_news.py <<'PY'
          import feedparser
          import json
          import re
          import requests
          from datetime import datetime, timezone

          SOURCES = [
              {
                  "name": "The Kathmandu Post",
                  "url": "https://kathmandupost.com/rss"
              },
              {
                  "name": "OnlineKhabar",
                  "url": "https://www.onlinekhabar.com/feed"
              }
          ]

          sections = {
              "national": [],
              "politics": [],
              "business": [],
              "sports": [],
              "technology": [],
              "entertainment": [],
              "world": [],
              "crime": [],
              "health": [],
              "weather": []
          }

          keywords = {
              "politics": [
                  "government", "minister", "parliament",
                  "election", "political", "prime minister",
                  "cabinet", "party", "congress"
              ],

              "business": [
                  "business", "economy", "bank", "market",
                  "company", "trade", "finance",
                  "investment", "stock", "nepse"
              ],

              "sports": [
                  "football", "cricket", "sport",
                  "tournament", "player", "match",
                  "league", "championship"
              ],

              "technology": [
                  "technology", "tech", "digital",
                  "artificial intelligence", " AI ",
                  "software", "internet", "cyber"
              ],

              "entertainment": [
                  "movie", "film", "music", "actor",
                  "actress", "entertainment", "concert",
                  "singer", "cinema"
              ],

              "world": [
                  "world", "international", "india",
                  "china", "america", "iran",
                  "israel", "usa", "ukraine",
                  "russia"
              ],

              "crime": [
                  "crime", "police", "arrest",
                  "murder", "fraud", "accident",
                  "security", "court", "criminal"
              ],

              "health": [
                  "health", "hospital", "doctor",
                  "disease", "medical", "medicine",
                  "patient", "healthcare"
              ],

              "weather": [
                  "weather", "rain", "flood",
                  "storm", "snow", "temperature",
                  "monsoon", "landslide"
              ]
          }

          def clean_html(text):
              if not text:
                  return ""

              text = re.sub(r"<[^>]*>", " ", text)
              text = re.sub(r"\s+", " ", text)

              return text.strip()

          def one_sentence(text):
              text = clean_html(text)

              if not text:
                  return "Read the original article for the latest information."

              sentences = re.split(r"(?<=[.!?])\s+", text)

              result = sentences[0].strip()

              if len(result) > 300:
                  result = result[:297].rsplit(" ", 1)[0] + "..."

              if not result.endswith((".", "!", "?")):
                  result += "."

              return result

          def classify(title, summary):

              text = (
                  title + " " + summary
              ).lower()

              scores = {}

              for section, words in keywords.items():

                  score = 0

                  for word in words:

                      word = word.strip().lower()

                      if word and word in text:
                          score += 1

                  scores[section] = score

              best = max(
                  scores,
                  key=scores.get
              )

              if scores[best] == 0:
                  return "national"

              return best

          all_articles = []
          seen_links = set()

          for source in SOURCES:

              print("")
              print("Reading:", source["name"])
              print("URL:", source["url"])

              try:

                  response = requests.get(
                      source["url"],
                      headers={
                          "User-Agent":
                          "Mozilla/5.0 NepalNewsTop10"
                      },
                      timeout=20
                  )

                  print(
                      "HTTP status:",
                      response.status_code
                  )

                  response.raise_for_status()

                  feed = feedparser.parse(
                      response.content
                  )

                  print(
                      "Articles found:",
                      len(feed.entries)
                  )

                  if len(feed.entries) == 0:
                      print(
                          "WARNING: feed returned zero articles"
                      )
                      continue

                  for item in feed.entries[:50]:

                      title = clean_html(
                          item.get("title", "")
                      )

                      summary = clean_html(
                          item.get(
                              "summary",
                              item.get("description", "")
                          )
                      )

                      link = item.get(
                          "link",
                          ""
                      ).strip()

                      published = item.get(
                          "published",
                          item.get("updated", "")
                      )

                      if not title or not link:
                          continue

                      if link in seen_links:
                          continue

                      seen_links.add(link)

                      section = classify(
                          title,
                          summary
                      )

                      all_articles.append({
                          "title": title,
                          "summary": one_sentence(
                              summary
                          ),
                          "source": source["name"],
                          "link": link,
                          "published": published,
                          "section": section
                      })

              except Exception as error:

                  print(
                      "ERROR reading source:",
                      error
                  )

          print("")
          print(
              "TOTAL ARTICLES:",
              len(all_articles)
          )

          if len(all_articles) == 0:

              raise RuntimeError(
                  "No articles were collected. "
                  "news.json was NOT changed."
              )

          for article in all_articles:

              section = article.pop(
                  "section"
              )

              sections[section].append(
                  article
              )

          for section in sections:

              sections[section] = (
                  sections[section][:10]
              )

          output = {
              "updated":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "sections": sections
          }

          with open(
              "news.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  output,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print("NEWS UPDATE COMPLETE")

          for section, articles in sections.items():

              print(
                  section,
                  "=>",
                  len(articles)
              )

          PY

          python update_news.py

      - name: Save news.json
        run: |
          git config user.name "Nepal News Bot"
          git config user.email "actions@github.com"

          git add news.json

          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Update Nepal news"
            git push
          fi
