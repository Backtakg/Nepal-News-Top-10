name: Update Nepal News

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-updater
  cancel-in-progress: true

jobs:
  scrape-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 feedparser

      - name: Run news scraper
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |
          python scraper.py

      - name: Validate news.json
        run: |
          test -f news.json

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("news.json")

          with path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          if not isinstance(data, dict):
              raise SystemExit("news.json is not a JSON object")

          if "sections" not in data:
              raise SystemExit("news.json is missing sections")

          sections = data["sections"]

          expected = [
              "national",
              "politics",
              "business",
              "sports",
              "technology",
              "entertainment",
              "world",
              "crime",
              "health",
              "weather"
          ]

          total = 0

          for section in expected:
              articles = sections.get(section, [])

              if not isinstance(articles, list):
                  raise SystemExit(
                      f"{section} is not a list"
                  )

              count = len(articles)

              print(
                  f"{section}: {count} articles"
              )

              total += count

          print(f"TOTAL ARTICLES: {total}")

          if total == 0:
              raise SystemExit(
                  "ERROR: scraper produced zero articles"
              )

          print("news.json validation PASSED")
          PY

      - name: Show news summary
        run: |
          python - <<'PY'
          import json

          with open("news.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          print("")
          print("====================================")
          print("NEWS DATABASE")
          print("====================================")
          print("Updated:", data.get("updated", ""))

          sections = data.get("sections", {})

          total = 0

          for section, articles in sections.items():
              count = len(articles)
              total += count
              print(f"{section}: {count}")

          print("------------------------------------")
          print("TOTAL:", total)
          print("====================================")
          PY

      - name: Commit updated news
        run: |
          git config user.name "Nepal News Bot"
          git config user.email "actions@github.com"

          git add news.json

          if git diff --cached --quiet; then
            echo "No news changes."
          else
            git commit -m "Update Nepal news"
            git push
          fi
