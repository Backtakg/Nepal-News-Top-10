name: Update Nepal News

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-nepal-news
  cancel-in-progress: true

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests

      - name: Build news database
        shell: bash
        run: |
          cat > update_news.py <<'PY'
          import feedparser
          import requests
          import json
          import re
          import hashlib
          from datetime import datetime, timezone
          from email.utils import parsedate_to_datetime


          # ============================================================
          # CONFIGURATION
          # ============================================================

          SECTIONS = [
              "weather",
              "national",
              "politics",
              "business",
              "sports",
              "technology",
              "entertainment",
              "world",
              "health",
              "crime",
          ]


          # Official/news publisher RSS/Atom feeds.
          # The workflow tests every feed and automatically ignores
          # feeds that fail or return no usable articles.
          SOURCES = [
              {
                  "name": "The Kathmandu Post",
                  "url": "https://kathmandupost.com/rss",
              },
              {
                  "name": "OnlineKhabar",
                  "url": "https://www.onlinekhabar.com/feed",
              },
              {
                  "name": "Setopati",
                  "url": "https://www.setopati.com/feed",
              },
              {
                  "name": "Ratopati",
                  "url": "https://www.ratopati.com/feed",
              },
              {
                  "name": "The Himalayan Times",
                  "url": "https://thehimalayantimes.com/rssFeed",
              },
              {
                  "name": "Nepali Times",
                  "url": "https://www.nepalitimes.com/feed/",
              },
              {
                  "name": "Ujyaalo Online",
                  "url": "https://ujyaaloonline.com/rss",
              },
              {
                  "name": "Nagarik News",
                  "url": "https://nagariknews.nagariknetwork.com/feed",
              },
              {
                  "name": "Naya Patrika",
                  "url": "https://www.nayapatrikadaily.com/feed",
              },
              {
                  "name": "Baahrakhari",
                  "url": "https://baahrakhari.com/feed",
              },
              {
                  "name": "Gorkhapatra Online",
                  "url": "https://gorkhapatraonline.com/rss",
              },
              {
                  "name": "The Rising Nepal",
                  "url": "https://risingnepaldaily.com/rss",
              },
          ]


          # ============================================================
          # CATEGORY KEYWORDS
          # ============================================================

          KEYWORDS = {
              "weather": [
                  "weather",
                  "rain",
                  "rainfall",
                  "flood",
                  "flooding",
                  "storm",
                  "thunderstorm",
                  "snow",
                  "temperature",
                  "monsoon",
                  "landslide",
                  "landslides",
                  "climate",
                  "heatwave",
                  "cold wave",
                  "heavy rain",
                  "lightning",
                  "disaster",
              ],

              "politics": [
                  "government",
                  "minister",
                  "parliament",
                  "election",
                  "political",
                  "politics",
                  "prime minister",
                  "cabinet",
                  "party",
                  "president",
                  "coalition",
                  "opposition",
                  "ruling party",
                  "lawmakers",
                  "federal",
              ],

              "business": [
                  "business",
                  "economy",
                  "economic",
                  "bank",
                  "banking",
                  "market",
                  "company",
                  "trade",
                  "finance",
                  "investment",
                  "stock",
                  "nepse",
                  "remittance",
                  "industry",
                  "tourism",
                  "inflation",
                  "exports",
                  "imports",
              ],

              "sports": [
                  "football",
                  "cricket",
                  "sport",
                  "sports",
                  "tournament",
                  "player",
                  "match",
                  "league",
                  "championship",
                  "olympic",
                  "athlete",
                  "fifa",
                  "icc",
                  "goal",
                  "wicket",
                  "runs",
              ],

              "technology": [
                  "technology",
                  "technology",
                  "tech",
                  "digital",
                  "artificial intelligence",
                  "ai",
                  "software",
                  "internet",
                  "cyber",
                  "computer",
                  "app",
                  "startup",
                  "smartphone",
                  "data",
                  "robot",
                  "innovation",
              ],

              "entertainment": [
                  "movie",
                  "film",
                  "music",
                  "actor",
                  "actress",
                  "entertainment",
                  "concert",
                  "singer",
                  "cinema",
                  "television",
                  "celebrity",
                  "album",
                  "festival",
                  "director",
                  "bollywood",
              ],

              "world": [
                  "world",
                  "international",
                  "india",
                  "china",
                  "america",
                  "iran",
                  "israel",
                  "usa",
                  "ukraine",
                  "russia",
                  "pakistan",
                  "united states",
                  "europe",
                  "global",
                  "foreign",
                  "middle east",
              ],

              "health": [
                  "health",
                  "hospital",
                  "doctor",
                  "disease",
                  "medical",
                  "medicine",
                  "patient",
                  "healthcare",
                  "virus",
                  "outbreak",
                  "dengue",
                  "vaccine",
                  "vaccination",
                  "epidemic",
                  "public health",
              ],

              "crime": [
                  "crime",
                  "police",
                  "arrest",
                  "murder",
                  "fraud",
                  "accident",
                  "security",
                  "court",
                  "criminal",
                  "investigation",
                  "robbery",
                  "abuse",
                  "theft",
                  "killed",
                  "kidnap",
                  "drugs",
              ],
          }


          # ============================================================
          # HTTP
          # ============================================================

          HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 "
                  "(compatible; NepalNewsTop10/2.0; "
                  "+https://github.com/Backtakg/Nepal-News-Top-10)"
              ),
              "Accept": (
                  "application/rss+xml, application/atom+xml, "
                  "application/xml, text/xml, */*"
              ),
          }


          session = requests.Session()
          session.headers.update(HEADERS)


          # ============================================================
          # HELPERS
          # ============================================================

          def clean(text):
              if not text:
                  return ""

              text = str(text)

              text = re.sub(
                  r"<script.*?</script>",
                  " ",
                  text,
                  flags=re.I | re.S,
              )

              text = re.sub(
                  r"<style.*?</style>",
                  " ",
                  text,
                  flags=re.I | re.S,
              )

              text = re.sub(
                  r"<[^>]+>",
                  " ",
                  text,
              )

              text = re.sub(
                  r"\s+",
                  " ",
                  text,
              )

              return text.strip()


          def normalize_title(title):
              title = clean(title).lower()

              title = re.sub(
                  r"[^\w\s]",
                  " ",
                  title,
                  flags=re.UNICODE,
              )

              title = re.sub(
                  r"\s+",
                  " ",
                  title,
              )

              return title.strip()


          def make_id(title):
              value = normalize_title(title)

              return hashlib.sha256(
                  value.encode("utf-8")
              ).hexdigest()


          def one_sentence(text, fallback_title=""):
              text = clean(text)

              if not text:
                  text = clean(fallback_title)

              if not text:
                  return "Latest news update."

              # Remove common feed prefixes.
              text = re.sub(
                  r"^(read more|continue reading)\s*:?\s*",
                  "",
                  text,
                  flags=re.I,
              )

              parts = re.split(
                  r"(?<=[.!?])\s+",
                  text,
              )

              sentence = parts[0].strip()

              if len(sentence) > 280:
                  sentence = (
                      sentence[:277]
                      .rsplit(" ", 1)[0]
                      + "..."
                  )

              if not sentence.endswith(
                  (".", "!", "?")
              ):
                  sentence += "."

              return sentence


          def parse_date(item):
              # Prefer published date, then updated date.
              for key in (
                  "published_parsed",
                  "updated_parsed",
              ):
                  value = item.get(key)

                  if value:
                      try:
                          from calendar import timegm

                          return datetime.fromtimestamp(
                              timegm(value),
                              timezone.utc,
                          )
                      except Exception:
                          pass

              for key in (
                  "published",
                  "updated",
              ):
                  value = item.get(key)

                  if not value:
                      continue

                  try:
                      parsed = parsedate_to_datetime(
                          value
                      )

                      if parsed.tzinfo is None:
                          parsed = parsed.replace(
                              tzinfo=timezone.utc
                          )

                      return parsed.astimezone(
                          timezone.utc
                      )
                  except Exception:
                      pass

              return None


          def date_string(item):
              dt = parse_date(item)

              if not dt:
                  return ""

              return dt.isoformat()


          def classify(title, summary):
              text = (
                  clean(title)
                  + " "
                  + clean(summary)
              ).lower()

              scores = {
                  section: 0
                  for section in KEYWORDS
              }

              for section, words in KEYWORDS.items():
                  for word in words:
                      # Word/phrase matching.
                      if word.lower() in text:
                          scores[section] += 1

              best = max(
                  scores,
                  key=scores.get,
              )

              if scores[best] == 0:
                  return "national"

              return best


          def importance(article):
              title = article["title"].lower()

              score = 0

              important_words = [
                  "breaking",
                  "latest",
                  "government",
                  "prime minister",
                  "president",
                  "election",
                  "death",
                  "dead",
                  "major",
                  "new",
                  "crisis",
                  "decision",
                  "agreement",
                  "earthquake",
                  "flood",
                  "war",
                  "victory",
                  "minister",
                  "alert",
                  "warning",
              ]

              for word in important_words:
                  if word in title:
                      score += 2

              if article.get("published"):
                  score += 1

              # Small preference for articles that have summaries.
              if article.get("summary"):
                  score += 1

              return score


          # ============================================================
          # FETCH FEEDS
          # ============================================================

          articles = []

          seen_links = set()
          seen_titles = set()

          working_sources = []
          failed_sources = []


          for source in SOURCES:

              print("")
              print("=" * 70)
              print("TESTING:", source["name"])
              print("URL:", source["url"])

              try:
                  response = session.get(
                      source["url"],
                      timeout=20,
                      allow_redirects=True,
                  )

                  response.raise_for_status()

                  content_type = (
                      response.headers
                      .get("content-type", "")
                      .lower()
                  )

                  if not response.content:
                      raise RuntimeError(
                          "Empty response"
                      )

                  feed = feedparser.parse(
                      response.content
                  )

                  if getattr(
                      feed,
                      "bozo",
                      False,
                  ):
                      print(
                          "Feed parser warning:",
                          getattr(
                              feed,
                              "bozo_exception",
                              "unknown",
                          ),
                      )

                  entries = feed.entries

                  usable_entries = []

                  for item in entries[:60]:

                      title = clean(
                          item.get(
                              "title",
                              "",
                          )
                      )

                      link = clean(
                          item.get(
                              "link",
                              "",
                          )
                      )

                      if title and link:
                          usable_entries.append(item)

                  if not usable_entries:
                      raise RuntimeError(
                          "Feed returned zero usable articles"
                      )

                  working_sources.append(
                      source["name"]
                  )

                  print(
                      "SUCCESS:",
                      len(usable_entries),
                      "usable articles",
                  )

                  for item in usable_entries:

                      title = clean(
                          item.get(
                              "title",
                              "",
                          )
                      )

                      summary_raw = clean(
                          item.get(
                              "summary",
                              item.get(
                                  "description",
                                  "",
                              ),
                          )
                      )

                      link = clean(
                          item.get(
                              "link",
                              "",
                          )
                      )

                      published = date_string(
                          item
                      )

                      if not title or not link:
                          continue

                      normalized = normalize_title(
                          title
                      )

                      # URL duplicate.
                      if link in seen_links:
                          continue

                      # Title duplicate.
                      if normalized in seen_titles:
                          continue

                      seen_links.add(link)
                      seen_titles.add(normalized)

                      section = classify(
                          title,
                          summary_raw,
                      )

                      articles.append({
                          "id": make_id(title),
                          "title": title,
                          "summary": one_sentence(
                              summary_raw,
                              title,
                          ),
                          "source": source["name"],
                          "link": link,
                          "published": published,
                          "section": section,
                      })

              except Exception as error:

                  print(
                      "FAILED:",
                      source["name"],
                  )

                  print(
                      "Reason:",
                      repr(error),
                  )

                  failed_sources.append({
                      "name": source["name"],
                      "url": source["url"],
                      "error": str(error),
                  })


          # ============================================================
          # SAFETY CHECK
          # ============================================================

          if not articles:
              raise RuntimeError(
                  "All configured news sources failed. "
                  "Keeping the existing news.json unchanged."
              )


          # ============================================================
          # SORT ARTICLES
          # ============================================================

          articles.sort(
              key=importance,
              reverse=True,
          )


          # ============================================================
          # BUILD 10 CATEGORIES × UP TO 10 STORIES
          # ============================================================

          result = {
              section: []
              for section in SECTIONS
          }


          for article in articles:

              section = article["section"]

              if section not in result:
                  section = "national"

              if len(result[section]) >= 10:
                  continue

              # IMPORTANT:
              # There is deliberately NO image field here.
              result[section].append({
                  "title": article["title"],
                  "summary": article["summary"],
                  "source": article["source"],
                  "link": article["link"],
                  "published": article["published"],
              })


          # ============================================================
          # OUTPUT
          # ============================================================

          output = {
              "updated": datetime.now(
                  timezone.utc
              ).isoformat(),

              "sources": {
                  "working": working_sources,
                  "failed": failed_sources,
              },

              "sections": result,
          }


          with open(
              "news.json",
              "w",
              encoding="utf-8",
          ) as file:
              json.dump(
                  output,
                  file,
                  ensure_ascii=False,
                  indent=2,
              )


          # ============================================================
          # REPORT
          # ============================================================

          print("")
          print("=" * 70)
          print("NEWS DATABASE UPDATED")
          print("=" * 70)

          print(
              "Total articles collected:",
              len(articles),
          )

          print(
              "Working sources:",
              len(working_sources),
          )

          for name in working_sources:
              print("  ✓", name)

          print("")
          print(
              "Failed sources:",
              len(failed_sources),
          )

          for source in failed_sources:
              print(
                  "  ✗",
                  source["name"],
                  "-",
                  source["error"],
              )

          print("")
          print("CATEGORY COUNTS")

          for section in SECTIONS:
              print(
                  f"  {section}: "
                  f"{len(result[section])}"
              )

          print("")
          print("news.json successfully generated.")
          PY

          python update_news.py


      - name: Validate news.json
        run: |
          echo "Validating news.json..."

          test -f news.json

          python -m json.tool news.json > /dev/null

          python - <<'PY'
          import json

          with open(
              "news.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          assert isinstance(data, dict)
          assert "updated" in data
          assert "sections" in data
          assert "sources" in data

          sections = data["sections"]

          required = [
              "weather",
              "national",
              "politics",
              "business",
              "sports",
              "technology",
              "entertainment",
              "world",
              "health",
              "crime",
          ]

          for section in required:
              assert section in sections
              assert isinstance(
                  sections[section],
                  list
              )

              assert len(
                  sections[section]
              ) <= 10

              for article in sections[section]:
                  assert article.get("title")
                  assert article.get("summary")
                  assert article.get("source")
                  assert article.get("link")

                  # Make absolutely sure images aren't accidentally
                  # inserted into the backend news objects.
                  assert "image" not in article
                  assert "image_url" not in article

          print("news.json validation PASSED.")
          print(
              "Working sources:",
              len(
                  data["sources"]["working"]
              )
          )

          for section in required:
              print(
                  f"{section}: "
                  f"{len(sections[section])}"
              )
          PY


      - name: Show news preview
        run: |
          echo ""
          echo "===== NEWS PREVIEW ====="

          python - <<'PY'
          import json

          with open(
              "news.json",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          for section, stories in data["sections"].items():
              print("")
              print(f"[{section.upper()}]")

              for i, story in enumerate(
                  stories[:3],
                  1
              ):
                  print(
                      f"{i}. {story['title']}"
                  )
                  print(
                      f"   {story['source']}"
                  )
          PY


      - name: Commit and push news database
        run: |
          git config user.name "Nepal News Bot"
          git config user.email "actions@github.com"

          git add news.json

          if git diff --cached --quiet; then
            echo "No news changes detected."
          else
            git commit -m "Update Nepal news"
            git push
          fi
