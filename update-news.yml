name: Update Nepal News

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-nepal-news
  cancel-in-progress: true

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests python-dateutil

      - name: Build news database
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          cat > update_news.py <<'PY'
          import feedparser
          import hashlib
          import html
          import json
          import re
          import requests
          from datetime import datetime, timezone
          from dateutil import parser as date_parser

          # ------------------------------------------------------------
          # Sources
          # Each source is tested independently. Broken/empty feeds are
          # skipped automatically and recorded in news.json.
          # ------------------------------------------------------------
          SOURCES = [
              {"name": "The Kathmandu Post", "url": "https://kathmandupost.com/rss"},
              {"name": "OnlineKhabar", "url": "https://www.onlinekhabar.com/feed"},
              {"name": "Setopati", "url": "https://www.setopati.com/feed"},
              {"name": "Ratopati", "url": "https://www.ratopati.com/feed"},
              {"name": "The Himalayan Times", "url": "https://thehimalayantimes.com/rssFeed"},
              {"name": "Nepali Times", "url": "https://www.nepalitimes.com/feed/"},
              {"name": "Ujyaalo Online", "url": "https://ujyaaloonline.com/rss"},
              {"name": "Nagarik News", "url": "https://nagariknews.nagariknetwork.com/feed"},
              {"name": "Naya Patrika", "url": "https://www.nayapatrikadaily.com/feed"},
              {"name": "Baahrakhari", "url": "https://baahrakhari.com/feed"},
              {"name": "Gorkhapatra Online", "url": "https://gorkhapatraonline.com/rss"},
              {"name": "The Rising Nepal", "url": "https://risingnepaldaily.com/rss"},
          ]

          SECTIONS = [
              "weather",
              "national",
              "politics",
              "business",
              "sports",
              "technology",
              "entertainment",
              "world",
              "health",
              "crime",
          ]

          KEYWORDS = {
              "weather": [
                  "weather", "rain", "rainfall", "flood", "storm", "snow",
                  "temperature", "monsoon", "landslide", "climate",
                  "thunderstorm", "lightning", "heatwave", "cold wave",
                  "तापक्रम", "वर्षा", "बाढी", "पहिरो", "मौसम", "मनसुन",
                  "हावाहुरी", "चट्याङ"
              ],
              "politics": [
                  "government", "minister", "parliament", "election",
                  "political", "prime minister", "cabinet", "party",
                  "president", "coalition", "ruling", "opposition",
                  "सरकार", "मन्त्री", "संसद", "निर्वाचन", "प्रधानमन्त्री",
                  "राष्ट्रपति", "दल", "गठबन्धन"
              ],
              "business": [
                  "business", "economy", "bank", "market", "company",
                  "trade", "finance", "investment", "stock", "nepse",
                  "remittance", "industry", "tourism", "inflation",
                  "बैंक", "व्यवसाय", "अर्थतन्त्र", "बजार", "शेयर",
                  "रेमिट्यान्स", "पर्यटन"
              ],
              "sports": [
                  "football", "cricket", "sport", "tournament", "player",
                  "match", "league", "championship", "olympic", "athlete",
                  "fifa", "icc", "खेल", "क्रिकेट", "फुटबल", "खेलाडी",
                  "प्रतियोगिता", "लिग"
              ],
              "technology": [
                  "technology", "tech", "digital", "artificial intelligence",
                  "ai", "software", "internet", "cyber", "computer", "app",
                  "startup", "mobile", "technology", "प्रविधि", "डिजिटल",
                  "कृत्रिम बुद्धिमत्ता", "साइबर", "एप"
              ],
              "entertainment": [
                  "movie", "film", "music", "actor", "actress",
                  "entertainment", "concert", "singer", "cinema",
                  "television", "celebrity", "movie", "फिल्म", "संगीत",
                  "गायक", "अभिनेता", "मनोरञ्जन", "सिनेमा"
              ],
              "world": [
                  "world", "international", "india", "china", "america",
                  "iran", "israel", "usa", "ukraine", "russia", "pakistan",
                  "united states", "global", "अन्तर्राष्ट्रिय", "भारत",
                  "चीन", "अमेरिका", "विश्व", "रुस", "पाकिस्तान"
              ],
              "crime": [
                  "crime", "police", "arrest", "murder", "fraud", "accident",
                  "security", "court", "criminal", "investigation", "robbery",
                  "abuse", "अपराध", "प्रहरी", "पक्राउ", "हत्या", "ठगी",
                  "दुर्घटना", "अदालत", "अनुसन्धान"
              ],
              "health": [
                  "health", "hospital", "doctor", "disease", "medical",
                  "medicine", "patient", "healthcare", "virus", "outbreak",
                  "dengue", "स्वास्थ्य", "अस्पताल", "डाक्टर", "रोग",
                  "चिकित्सा", "बिरामी", "डेङ्गु"
              ],
          }

          IMPORTANT_WORDS = [
              "breaking", "latest", "major", "crisis", "decision",
              "agreement", "earthquake", "flood", "war", "victory",
              "government", "prime minister", "president", "election",
              "death", "minister", "warning", "alert"
          ]

          HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 (X11; Linux x86_64) "
                  "AppleWebKit/537.36 Chrome/131 Safari/537.36 "
                  "NepalNewsTop10/2.0"
              ),
              "Accept": "application/rss+xml, application/atom+xml, "
                        "application/xml, text/xml, text/html;q=0.9, */*;q=0.8",
          }

          SESSION = requests.Session()
          SESSION.headers.update(HEADERS)

          def clean(value):
              if not value:
                  return ""
              value = html.unescape(str(value))
              value = re.sub(r"<script\b[^>]*>.*?</script>", " ", value,
                             flags=re.I | re.S)
              value = re.sub(r"<style\b[^>]*>.*?</style>", " ", value,
                             flags=re.I | re.S)
              value = re.sub(r"<[^>]+>", " ", value)
              value = re.sub(r"\s+", " ", value)
              return value.strip()

          def one_sentence(value):
              value = clean(value)
              if not value:
                  return "Read the original article for the latest information."
              parts = re.split(r"(?<=[.!?।])\s+", value)
              sentence = parts[0].strip()
              if len(sentence) > 280:
                  sentence = sentence[:277].rsplit(" ", 1)[0] + "..."
              if not sentence.endswith((".", "!", "?", "।")):
                  sentence += "."
              return sentence

          def normalize_title(value):
              return re.sub(r"\s+", " ", clean(value)).lower().strip()

          def article_id(title, link):
              raw = (normalize_title(title) + "|" + link.strip()).encode("utf-8")
              return hashlib.sha256(raw).hexdigest()[:20]

          def parse_date(entry):
              for key in ("published", "updated", "created", "date"):
                  value = entry.get(key)
                  if not value:
                      continue
                  try:
                      return date_parser.parse(str(value)).astimezone(timezone.utc).isoformat()
                  except Exception:
                      pass
              return ""

          def score_category(title, summary):
              text = (title + " " + summary).lower()
              scores = {section: 0 for section in SECTIONS}

              for section, words in KEYWORDS.items():
                  for word in words:
                      if word.lower() in text:
                          # Multi-word matches are more useful.
                          scores[section] += 2 if " " in word else 1

              # Weather terms get a small priority boost because Weather
              # is a first-class news category in this site.
              if scores["weather"] > 0:
                  scores["weather"] += 1

              best = max(scores, key=scores.get)
              return best if scores[best] else "national"

          def importance(article):
              title = article["title"].lower()
              score = 0
              for word in IMPORTANT_WORDS:
                  if word in title:
                      score += 2
              if article["published"]:
                  score += 1
              return score

          def published_timestamp(article):
              try:
                  return date_parser.parse(article["published"]).timestamp()
              except Exception:
                  return 0

          def image_from_entry(entry):
              # RSS/Atom feeds expose images in several different ways.
              candidates = []

              for key in ("media_content", "media_thumbnail", "enclosures"):
                  value = entry.get(key, [])
                  if isinstance(value, dict):
                      value = [value]
                  if isinstance(value, list):
                      candidates.extend(value)

              for item in candidates:
                  if not isinstance(item, dict):
                      continue
                  for key in ("url", "href"):
                      url = item.get(key)
                      if url and str(url).startswith(("http://", "https://")):
                          return str(url).strip()

              # Some feeds put image URLs in the HTML summary/content.
              for key in ("content", "summary", "description"):
                  raw = entry.get(key, "")
                  if isinstance(raw, list):
                      raw = " ".join(
                          str(x.get("value", "")) if isinstance(x, dict) else str(x)
                          for x in raw
                      )
                  match = re.search(
                      r'<img[^>]+src=["\']([^"\']+)["\']',
                      str(raw),
                      flags=re.I
                  )
                  if match:
                      return html.unescape(match.group(1)).strip()

              return ""

          def is_good_image(url):
              return bool(
                  url and
                  url.startswith(("http://", "https://")) and
                  not url.lower().startswith("data:")
              )

          articles = []
          seen_links = set()
          seen_titles = set()
          working_sources = []
          failed_sources = []

          for source in SOURCES:
              print(f"\n{'=' * 72}\nTesting: {source['name']}\n{source['url']}")

              try:
                  response = SESSION.get(source["url"], timeout=(10, 25))
                  response.raise_for_status()

                  feed = feedparser.parse(response.content)
                  if getattr(feed, "bozo", 0) and not feed.entries:
                      raise RuntimeError("Invalid feed and zero entries")

                  entries = feed.entries
                  if not entries:
                      raise RuntimeError("Feed returned zero articles")

                  usable = 0

                  for item in entries[:80]:
                      title = clean(item.get("title", ""))
                      link = clean(item.get("link", ""))
                      summary = clean(
                          item.get("summary", item.get("description", ""))
                      )

                      if not title or not link:
                          continue

                      # Skip duplicate links and near-identical titles.
                      title_key = normalize_title(title)
                      if link in seen_links or title_key in seen_titles:
                          continue

                      seen_links.add(link)
                      seen_titles.add(title_key)

                      published = parse_date(item)
                      section = score_category(title, summary)
                      image = image_from_entry(item)

                      articles.append({
                          "id": article_id(title, link),
                          "title": title,
                          "summary": one_sentence(summary),
                          "source": source["name"],
                          "link": link,
                          "published": published,
                          "section": section,
                          "image": image if is_good_image(image) else "",
                      })
                      usable += 1

                  if usable == 0:
                      raise RuntimeError("Feed had entries but no usable articles")

                  working_sources.append({
                      "name": source["name"],
                      "url": source["url"],
                      "articles": usable,
                  })
                  print(f"SUCCESS: {usable} usable articles")

              except Exception as exc:
                  failed_sources.append({
                      "name": source["name"],
                      "url": source["url"],
                      "error": str(exc)[:300],
                  })
                  print(f"FAILED: {source['name']} — {exc}")

          if not articles:
              raise RuntimeError("All news sources failed; refusing to overwrite news.json.")

          # Newest first; importance is a secondary tie-breaker.
          articles.sort(
              key=lambda x: (published_timestamp(x), importance(x)),
              reverse=True,
          )

          result = {section: [] for section in SECTIONS}

          # Fill each category with its 10 newest/highest-quality stories.
          for section in SECTIONS:
              candidates = [a for a in articles if a["section"] == section]
              candidates.sort(
                  key=lambda x: (published_timestamp(x), importance(x)),
                  reverse=True,
              )

              for article in candidates[:10]:
                  result[section].append({
                      "id": article["id"],
                      "title": article["title"],
                      "summary": article["summary"],
                      "source": article["source"],
                      "link": article["link"],
                      "published": article["published"],
                      "image": article["image"],
                  })

          # Latest section uses the newest stories globally.
          latest = sorted(
              articles,
              key=lambda x: (published_timestamp(x), importance(x)),
              reverse=True,
          )[:20]

          output = {
              "updated": datetime.now(timezone.utc).isoformat(),
              "latest": [
                  {
                      "id": a["id"],
                      "title": a["title"],
                      "summary": a["summary"],
                      "source": a["source"],
                      "link": a["link"],
                      "published": a["published"],
                      "section": a["section"],
                      "image": a["image"],
                  }
                  for a in latest
              ],
              "sources": {
                  "working": working_sources,
                  "failed": failed_sources,
              },
              "sections": result,
          }

          with open("news.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print("\n" + "=" * 72)
          print("NEWS DATABASE UPDATED")
          print("=" * 72)
          print(f"Working sources: {len(working_sources)}")
          print(f"Failed sources:  {len(failed_sources)}")
          print(f"Total articles:  {len(articles)}")
          for section in SECTIONS:
              print(f"{section:15} {len(result[section])}")

          PY

          python update_news.py

      - name: Validate news.json
        run: |
          python -m json.tool news.json > /dev/null
          test -s news.json
          echo "news.json is valid and non-empty."

      - name: Show source report
        run: |
          python - <<'PY'
          import json
          with open("news.json", encoding="utf-8") as f:
              d = json.load(f)

          print("Working sources:")
          for s in d.get("sources", {}).get("working", []):
              print("  ✓", s["name"], "-", s["articles"])

          print("\nFailed sources:")
          for s in d.get("sources", {}).get("failed", []):
              print("  ✗", s["name"], "-", s["error"])

          print("\nCategory counts:")
          for name, items in d["sections"].items():
              print(" ", name, len(items))
          PY

      - name: Commit updated news
        run: |
          git config user.name "Nepal News Bot"
          git config user.email "actions@github.com"

          git add news.json

          if git diff --cached --quiet; then
            echo "No news changes to commit."
          else
            git commit -m "Update Nepal news"
            git push
          fi
